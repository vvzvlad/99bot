# Mirrors what actually runs in production: the `telegram_bots` stack (id 140) in Portainer
# on nebula.lc. Keep this file and that stack in step — the copy that is deployed lives in
# Portainer, this one is the readable record of it.
#
# Two deliberate differences from the deployed copy:
#   * TG_API_ID and TG_API_HASH are literal values on the stack and placeholders here;
#   * the stack holds several services; this file describes only 99bot.
# Anything else that differs is drift. Open item: the stack still pulls
# `ghcr.io/vvzvlad/99bot:latest` and has to be repointed at the image below.
volumes:
  # Holds chat_manager_bot.session, the Kurigram session for the userbot account. Losing it
  # means re-authorising by hand with a phone number and a code, so it has to stay a named
  # volume; in production it is `telegram_bots_99bot` (compose prefixes the stack name).
  99bot:

services:
  99bot:
    # Published by .gitea/workflows/image-check-publish.yml on every push to main, after
    # the smoke gate passes. GitHub is a push-mirror and publishes nothing.
    image: gitea.vvzvlad.xyz/projects/99bot:latest
    container_name: 99bot
    # `always`, matching the stack: the bot comes back even after a manual stop and a
    # daemon restart. A misconfiguration does not loop silently: src/config.py exits 1
    # with a message on every attempt.
    restart: always
    volumes:
      - 99bot:/app/data
    environment:
      TZ: Europe/Moscow
      # Telegram API credentials for the userbot account. Placeholders on purpose: the
      # real values are set on the stack in Portainer and must never land in git.
      # src/config.py exits 1 with "TG_API_ID and TG_API_HASH must be set" when either is
      # missing.
      TG_API_ID: ${TG_API_ID}
      TG_API_HASH: ${TG_API_HASH}
    logging:
      driver: "json-file"
      options:
        max-file: 5
        max-size: 10m
    labels:
      # Read by Portainer's own image updater (it honours watchtower's label as well as
      # `io.portainer.update.enable`), which redeploys the container when :latest moves —
      # the reason the publishing workflow has no `pull_request` trigger.
      # Quoted, as on the stack: docker labels are strings, a bare `true` is a YAML boolean.
      com.centurylinklabs.watchtower.enable: "true"
