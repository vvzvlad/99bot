name: Tests

# PR gate. Never logs in to the registry, never pushes, uses no secrets. It proves that the
# image builds, its declared command matches the file it names, the missing-environment
# guard fires, every Kurigram symbol the handlers use exists and every register_handler()
# runs — while :latest, which production follows, stays untouched by PR branches.
on:
  # Manual re-run of a run that flaked on runner networking; safe, nothing is published.
  workflow_dispatch:
  # A PR runs its head on the self-hosted runner that mounts the host's docker socket.
  # That is acceptable because self-registration on gitea.vvzvlad.xyz is disabled, so
  # every PR comes from someone with push access. A same-repo `head.repo.full_name` guard
  # is not used: the expression is unverified on Gitea, and an `if:` that silently
  # evaluates to false would turn this into a gate that never runs.
  pull_request:
    # Must name the real default branch; a stale name makes the gate silently never run.
    branches: [ "main" ]

permissions:
  contents: read   # checkout

# Nothing is published, so a superseded run has no value: cancel it on a new push.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    # A label, not a machine name: the shared self-hosted runner advertises
    # `ubuntu-latest` and `ubuntu-22.04`; any other name leaves the job queued forever.
    runs-on: ubuntu-latest
    # Same outer bound as image-check-publish.yml. Must exceed the step timeouts
    # (20 build + 10 smoke): a job killed by it may never run its `if: always()` cleanup.
    timeout-minutes: 55
    # Job-level so the smoke step and the cleanup step share one value: ci/smoke.py names
    # its containers after it and the cleanup removes them by it. The run id keeps
    # concurrent runs on the shared daemon apart; ci/smoke.py refuses to start without it.
    env:
      SMOKE_NAME: 99bot-pr-check-${{ github.run_id }}
    steps:
    - uses: actions/checkout@v7

    - name: Compute the local image tag
      id: tags
      # A purely local tag: no registry host in front of it, so there is nothing here that
      # `docker push` could even target. The run id keeps concurrent PR checks on the
      # shared runner daemon from clobbering each other's tag.
      env:
        RUN_ID: ${{ github.run_id }}
      run: |
        echo "local=99bot-pr-check:$RUN_ID" >> "$GITHUB_OUTPUT"

    - name: Build the Docker image
      # Step-level timeouts are the ones act_runner enforces; same value as in
      # image-check-publish.yml, which builds the identical Dockerfile.
      timeout-minutes: 20
      env:
        # Through the environment rather than interpolated into the script text.
        LOCAL_TAG: ${{ steps.tags.outputs.local }}
      run: |
        # --pull: the self-hosted runner has a persistent daemon, so without it a cached
        # python:3.11-slim would go stale for months.
        docker build --pull . --file Dockerfile --tag "$LOCAL_TAG"

    - name: Smoke-test the built image
      # The whole PR gate: the same ci/smoke.py as image-check-publish.yml, on a local tag.
      # It runs on the RUNNER and drives `docker run` itself, because two of its checks
      # (no-environment behaviour, the image CMD from `docker inspect`) concern the
      # container as a whole. The runner image has `python3`, not `python`.
      # It uses fake api_id/api_hash, so no session is needed; its verdict is taken before
      # the client touches the network. Containers carry the run id and map no ports.
      # 10 minutes covers ci/smoke.py's documented worst case of 465 s.
      timeout-minutes: 10
      env:
        SMOKE_IMAGE: ${{ steps.tags.outputs.local }}
      # This step's body is byte-identical to the one in image-check-publish.yml; only
      # `env:` differs, so the PR gate and the publishing gate cannot drift apart.
      run: |
        python3 ci/smoke.py

    - name: Remove the smoke containers from the runner
      # Normally a no-op: ci/smoke.py removes its containers itself. This catches the run
      # where the smoke step was killed by its timeout — a subprocess timeout kills the
      # docker client, not the container, so even `--rm` ones survive. Runs before the
      # image cleanup because a leftover container pins the image.
      if: always()
      run: |
        # The empty suffix is check (d)'s container; -guard and -probe are the two the gate
        # runs with `--rm`. Kept in step with GUARD_SUFFIX/PROBE_SUFFIX in ci/smoke.py.
        # Best-effort: no `set -e`, a leftover container must not turn the job red.
        for suffix in "" -guard -probe; do docker rm -f "$SMOKE_NAME$suffix" || true; done

    - name: Remove the built image from the runner
      # Removes ONLY this run's tag; no `docker system prune` on a daemon shared with other
      # repos. The BuildKit cache and the dangling old base image left by `--pull` need a
      # periodic cleanup on the runner host.
      if: always()
      env:
        LOCAL_TAG: ${{ steps.tags.outputs.local }}
      run: |
        docker rmi "$LOCAL_TAG" || true
