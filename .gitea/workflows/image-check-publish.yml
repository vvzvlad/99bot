name: Docker Image CI

# No `pull_request` trigger here on purpose: this workflow pushes :latest, and :latest is
# what production follows — the `99bot` container in the `telegram_bots` stack on
# the production Docker host carries `com.centurylinklabs.watchtower.enable=true`, which Portainer's own
# auto-updater honours alongside `io.portainer.update.enable`. A PR branch must never move
# that tag; PRs are covered by tests.yml, which runs the same gate but never pushes.
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

# No `packages: write`: that scope is GitHub-specific, and Gitea's GITEA_TOKEN carries no
# package scope. The push authenticates with the REGISTRY_TOKEN PAT (an organisation
# secret on `projects`, inherited by this repo).
permissions:
  contents: read   # checkout

# Runs on one branch are serialised so the newest commit's :latest is written last.
# Cancelling stays OFF: it would drop the older run's :<sha> image and leave holes in the
# tag history where a rollback may be needed.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # A label, not a machine name: the shared self-hosted runner advertises
    # `ubuntu-latest` and `ubuntu-22.04`; any other name leaves the job queued forever.
    runs-on: ubuntu-latest
    # The runner is shared by the whole fleet. Must exceed the sum of the step timeouts
    # (20 build + 10 smoke + 15 push): when this fires, act_runner kills the job and the
    # `if: always()` cleanup steps may not run.
    timeout-minutes: 55
    # Job-level so the smoke step and the cleanup step share one value: ci/smoke.py names
    # its containers after it and the cleanup removes them by it. The run id keeps
    # concurrent runs on the shared daemon apart; ci/smoke.py refuses to start without it.
    env:
      SMOKE_NAME: 99bot-smoke-${{ github.run_id }}
    steps:
    - uses: actions/checkout@v7

    - name: Compute image tags
      id: tags
      # main -> :latest + :<sha> (production follows :latest); ANY other branch ->
      # :<branch> (workflow_dispatch can run off any ref).
      # "main" here and in the `branches:` filter above must name the real default branch
      # (also in tests.yml and dockercompose.yml). A wrong name fails silently: either
      # pushes stop triggering the workflow, or it builds but never produces :latest.
      # Never hardcode a fixed tag in the else branch: a side branch would overwrite the
      # tag production deploys from.
      env:
        # Through the environment, not interpolated into the script: git allows `$`,
        # backticks and parentheses in branch names, and the self-hosted runner mounts the
        # host's docker socket.
        REF_NAME: ${{ github.ref_name }}
        REPO: ${{ github.repository }}
        SHA: ${{ github.sha }}
      run: |
        # Docker rejects uppercase in an image path, so the repo name is lowercased. The
        # path is derived from $REPO (gitea.vvzvlad.xyz/projects/99bot) rather than typed.
        IMAGE="gitea.vvzvlad.xyz/$(printf '%s' "$REPO" | tr 'A-Z' 'a-z')"
        if [ "$REF_NAME" = "main" ]; then
          # Tag ORDER matters: the push step goes left to right, so :latest is pushed LAST.
          # If :<sha> fails to push, :latest never moves and production keeps the
          # previous image, which always has its immutable rollback twin.
          echo "tags=$IMAGE:$SHA $IMAGE:latest" >> "$GITHUB_OUTPUT"
          # The smoke gate needs one unambiguous tag; :<sha> can only mean this commit.
          echo "smoke=$IMAGE:$SHA" >> "$GITHUB_OUTPUT"
        else
          # Sanitise the branch name into a legal docker tag
          # ([a-zA-Z0-9_][a-zA-Z0-9._-]{0,127}): illegal characters become `-`, a leading
          # non-word character becomes `_`, and the result is cut to 100 chars.
          branch_tag=$(printf '%s' "$REF_NAME" | tr -c 'A-Za-z0-9_.-' '-' | sed 's/^[^A-Za-z0-9_]/_/' | cut -c1-100)
          # A branch literally named `latest` would otherwise produce the production tag.
          if [ "$branch_tag" = "latest" ]; then
            branch_tag="branch-latest"
          fi
          echo "tags=$IMAGE:${branch_tag}" >> "$GITHUB_OUTPUT"
          echo "smoke=$IMAGE:${branch_tag}" >> "$GITHUB_OUTPUT"
        fi

    - name: Build the Docker image
      # Step-level timeouts are the ones act_runner enforces. A cold build pulls the CPU
      # build of torch and the SSCD model and compiles pdqhash, which has no wheels.
      timeout-minutes: 20
      env:
        # Through the environment, not interpolated. `$TAGS` is unquoted below on purpose:
        # word splitting turns the space-separated list into loop items.
        TAGS: ${{ steps.tags.outputs.tags }}
      run: |
        tag_args=""
        for tag in $TAGS; do tag_args="$tag_args --tag $tag"; done
        # --pull: the self-hosted runner has a persistent daemon, so without it a cached
        # python:3.11-slim would go stale for months. requirements.txt pins nothing from
        # above, so the base image should at least be current.
        docker build --pull . --file Dockerfile $tag_args

    - name: Smoke-test the built image
      # The only gate before :latest goes live: a red smoke means nothing reaches the
      # registry. ci/smoke.py runs on the RUNNER and drives `docker run` itself, because
      # two of its checks (no-environment behaviour, the image CMD from `docker inspect`)
      # concern the container as a whole. The runner image has `python3`, not `python`.
      # It uses fake api_id/api_hash and SESSION_PATH under /tmp, so no credential or
      # session is involved; its verdict is taken before the client touches the network.
      # The containers carry the run id in their names and map no ports.
      # 10 minutes covers ci/smoke.py's documented worst case of 465 s.
      timeout-minutes: 10
      env:
        SMOKE_IMAGE: ${{ steps.tags.outputs.smoke }}
      # This step's body is byte-identical to the one in tests.yml; only `env:` differs,
      # so the PR gate and the publishing gate cannot drift apart.
      run: |
        python3 ci/smoke.py

    - name: Log in to the Gitea container registry
      # Only after build and smoke: both run arbitrary code on a runner that mounts the
      # host's docker socket, so the credentials stay out of the docker config until now.
      uses: docker/login-action@v4
      with:
        registry: gitea.vvzvlad.xyz
        username: ${{ github.repository_owner }}
        # PAT with `write:package`, an organisation secret on `projects`. Do not add a
        # repo-level secret of the same name: it would shadow the org one.
        password: ${{ secrets.REGISTRY_TOKEN }}

    - name: Push Docker images
      # Generous on purpose: a timeout mid-push leaves a half-pushed :<sha> and no :latest.
      timeout-minutes: 15
      env:
        # Unquoted below so it word-splits into items.
        TAGS: ${{ steps.tags.outputs.tags }}
      run: |
        # A failed :<sha> push must stop the loop before :latest; do not rely on the
        # runner invoking bash with -e.
        set -e
        # Count after word splitting: a whitespace-only $TAGS would pass `[ -n ]` and push
        # nothing while the step stays green. (`set -u` would not catch it either: the
        # variable arrives set but empty.)
        set -- $TAGS
        [ "$#" -gt 0 ] || { echo "No tags to push: the tag-computation step produced no usable output. Refusing to report a successful push that pushed nothing — :latest would stay on the previous image and look deployed." >&2; exit 1; }
        for tag in "$@"; do docker push "$tag"; done

    - name: Remove the smoke containers from the runner
      # Normally a no-op: ci/smoke.py removes its containers itself. This catches the run
      # where the smoke step was killed by its timeout — a subprocess timeout kills the
      # docker client, not the container, so even `--rm` ones survive. Runs before the
      # image cleanup because a leftover container pins the image.
      if: always()
      run: |
        # The empty suffix is check (d)'s container; -guard and -probe are the two the gate
        # runs with `--rm`. Kept in step with GUARD_SUFFIX/PROBE_SUFFIX in ci/smoke.py.
        # Best-effort: no `set -e`, a leftover container must not turn the job red.
        for suffix in "" -guard -probe; do docker rm -f "$SMOKE_NAME$suffix" || true; done

    - name: Remove the built images from the runner
      # Removes ONLY this run's tags; no `docker system prune` on a daemon shared with
      # other repos. The BuildKit cache and the dangling old base image left by `--pull`
      # are not reclaimed here and need a periodic cleanup on the runner host.
      if: always()
      env:
        TAGS: ${{ steps.tags.outputs.tags }}
      run: |
        # An empty $TAGS is fine here, unlike in the push step: there is nothing to remove.
        for tag in $TAGS; do docker rmi "$tag" || true; done
